<!-- Nuvo Command Centre, tabs.
     Injected by netlify/functions/site.js, exactly like the chat widget, and for
     the same reason: the refresh task rebuilds command-centre.html twice a
     weekday and none of this should be its job to get right each time.

     command-centre.html is the Today tab and nothing else. Notes, Blog and
     Reports are rendered here from /api/notes, /api/blog and /api/reports.

     Everything below lives outside .wrap on purpose. The chat reads .wrap as its
     page context; if a panel were inside it, Ben's notes would be fed back into
     every question he asked. -->
<style>
  .tabbar-wrap { background: var(--navy, #143f5c); border-bottom: 1px solid rgba(255,255,255,.12); }
  .tabbar { max-width: 680px; margin: 0 auto; display: flex; padding: 0 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabbtn { flex: 1 0 auto; font: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,.62); padding: 12px 14px 10px;
    border-bottom: 3px solid transparent; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
  .tabbtn svg { width: 16px; height: 16px; }
  .tabbtn.on { color: #fff; border-bottom-color: var(--sand, #cfb39c); }
  .tabbtn .tcount { font-size: 10px; font-weight: 700; line-height: 1;
    padding: 3px 6px; border-radius: 50px; background: var(--sand, #cfb39c); color: #143f5c; }

  /* The mail strip. Sits under the ask bar on Today only. The page is rebuilt
     twice a weekday, so between rebuilds it is the only thing on screen that
     can tell him what has actually just landed. */
  .mailbar { max-width: 680px; margin: 0 auto; padding: 0 16px 4px; }
  .mailbtn { display: inline-flex; align-items: center; gap: 7px; font: inherit;
    font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 50px;
    padding: 8px 14px; border: 1px solid var(--border, rgba(20,63,92,.12));
    background: var(--surface-1, #fff); color: var(--navy, #143f5c); }
  .mailbtn svg { width: 15px; height: 15px; }
  .mailbtn:disabled { opacity: .55; cursor: default; }
  .mailwhen { font-size: 11px; color: var(--ink-muted, #928d8a); margin-left: 9px; }
  .mailspan { display: inline-flex; gap: 5px; margin-left: 8px; }
  .mailspan button { font: inherit; font-size: 11px; cursor: pointer; padding: 5px 10px;
    border-radius: 50px; border: 1px solid var(--border, rgba(20,63,92,.12));
    background: transparent; color: var(--ink-muted, #928d8a); }
  .mailspan button.on { background: var(--navy, #143f5c); color: #fff; border-color: var(--navy, #143f5c); }
  .mailout { margin-top: 10px; }
  .mailmsg { background: var(--surface-1, #fff); border: 1px solid var(--border, rgba(20,63,92,.12));

  .mailmsg .mf { font-size: 12px; font-weight: 700; color: var(--navy, #143f5c); }
  .mailmsg .ms { font-size: 14px; font-weight: 600; margin: 2px 0 4px; line-height: 1.35; }
  .mailmsg .mp { font-size: 12px; color: var(--ink-2, #6b6766); line-height: 1.5; }
  .mailmsg .mw { font-size: 10px; color: var(--ink-muted, #928d8a); letter-spacing: .04em; margin-top: 7px; }
  .mailmsg.unread { border-left: 3px solid var(--navy, #143f5c); }
  .mailnote { font-size: 13px; line-height: 1.55; color: var(--ink-2, #6b6766);

  .awflag { display: inline-block; margin-left: 6px; font-size: 9.5px; font-weight: 700;

  .awwhy { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--ink-2, #6b6766);
    background: var(--offwhite, #f0ede8); border-radius: 6px; padding: 8px 10px; }
  .awkey { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 0;
    font-size: 11px; color: var(--ink-muted, #928d8a); }

  .awkey i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

  .card { background: var(--surface-1, #fff); border: 1px solid var(--border, rgba(20,63,92,.12));
    border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card .when { font-size: 11px; color: var(--ink-muted, #928d8a); margin-top: 9px;
    letter-spacing: .04em; }
  .card .body { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .card .body a { color: var(--navy, #143f5c); }

  .composer { background: var(--surface-1, #fff); border: 1px solid var(--border, rgba(20,63,92,.12));
    border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  .composer textarea { width: 100%; display: block; font: inherit; font-size: 16px;
    line-height: 1.5; border: none; outline: none; resize: none; background: transparent;
    color: var(--ink-1, #454242); min-height: 62px; padding: 2px; }
  .composer textarea::placeholder { color: var(--ink-muted, #928d8a); }
  .composer .crow { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
  .composer .chint { flex: 1; font-size: 11px; color: var(--ink-muted, #928d8a); }
  .btn { font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border-radius: 50px; padding: 9px 17px; border: 1px solid var(--navy, #143f5c);
    background: var(--navy, #143f5c); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.quiet { background: transparent; color: var(--navy, #143f5c); }
  .btn.small { font-size: 12px; padding: 7px 13px; }
  .btn.danger { border-color: var(--critical, #d03b3b); color: var(--critical, #d03b3b); background: transparent; }

  .noteact { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }

  /* ---------- the pad ---------- */
  /* Sticky notes, because that is what they are. The shape does the work: a
     small square of coloured paper reads as "jotted and forgotten" in a way a
     white rectangle with a border never will, and Ben scans the pad by colour
     and position rather than by reading every one. Kept quiet enough to sit
     next to the navy: paper tones, not highlighter. */
  /* align-items:start is the important one. A grid stretches every cell to the
     tallest in its row by default, so one long note left a tall empty gap under
     every short note beside it. That was most of why the pad looked messy.
     200px minimum, not 150: at 150 a note was about eighteen characters a line
     and every note read as ragged. */
  .pad { display: grid; gap: 16px; margin-top: 6px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .sticky { position: relative; display: flex; flex-direction: column;
    min-height: 152px; padding: 15px 15px 13px; border: none; border-radius: 2px;
    background: var(--p1); color: #33302e;
    box-shadow: 0 1px 1px rgba(0,0,0,.10), 0 6px 14px -6px rgba(0,0,0,.30);
    transition: transform .13s ease, box-shadow .13s ease; }
  /* Deterministic tilt, from the note's position in the pad, so it never jumps
     when the list re-renders. */
  .sticky:nth-child(4n+1) { transform: rotate(-0.7deg); }
  .sticky:nth-child(4n+2) { transform: rotate(0.5deg); }
  .sticky:nth-child(4n+3) { transform: rotate(0.9deg); }
  .sticky:nth-child(4n+4) { transform: rotate(-0.4deg); }
  .sticky:hover, .sticky:focus-within {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: 0 2px 3px rgba(0,0,0,.12), 0 12px 22px -8px rgba(0,0,0,.34); }

  /* The turned-up corner. One triangle, no images. */
  .sticky::after { content: ""; position: absolute; right: 0; bottom: 0;
    width: 17px; height: 17px;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.09) 50%); }

  .sticky .stext { flex: 1; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    cursor: text; }
  /* A long note used to become a wall of paper taller than the screen. Clamp it
     and let him open it. Ten lines is about where a note stops being a note. */
  .sticky .stext.clamped { display: -webkit-box; -webkit-line-clamp: 10;
    -webkit-box-orient: vertical; overflow: hidden; }
  .sticky .smore { align-self: flex-start; margin-top: 6px; padding: 0;
    background: none; border: none; cursor: pointer; font: inherit; font-size: 11px;
    font-weight: 700; letter-spacing: .04em; text-decoration: underline;
    color: rgba(51,48,46,.62); }

  /* Editing. The tilt comes off while typing: a rotated textarea is unpleasant
     to write in and the caret lands wrong. */
  .sticky.editing { transform: rotate(0deg) !important; }
  .sticky .sedit { flex: 1; width: 100%; display: block; font: inherit;
    font-size: 15px; line-height: 1.5; border: none; outline: none; resize: none;
    background: rgba(255,255,255,.42); color: #33302e; border-radius: 2px;
    padding: 7px 8px; min-height: 96px; }
  .sticky .sedit:focus { background: rgba(255,255,255,.72);
    box-shadow: inset 0 0 0 1px rgba(51,48,46,.22); }
  .sticky .serr { margin-top: 7px; font-size: 11px; line-height: 1.45;
    color: #8a2020; }
  /* Was uppercase and letter-spaced, which shouted louder than the note itself,
     and it carried the "on Today" text inline so the line ran to three rows. */
  .sticky .swhen { margin-top: 11px; font-size: 11px; line-height: 1.4;
    color: rgba(51,48,46,.58); display: flex; flex-wrap: wrap;
    align-items: center; gap: 6px; }
  .sticky .stag { font-size: 9.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 2px;
    background: rgba(51,48,46,.13); color: rgba(51,48,46,.72); }
  .sticky .noteact { margin-top: 8px; gap: 5px; }
  .sticky .noteact { margin-top: 10px; gap: 6px; }
  .sticky .btn { font-size: 11px; font-weight: 700; padding: 6px 11px;
    border-radius: 3px; white-space: nowrap;
    background: transparent; border-color: rgba(51,48,46,.28); color: #33302e; }
  .sticky .btn.prim { background: rgba(51,48,46,.86); color: var(--p1);
    border-color: rgba(51,48,46,.86); }
  .sticky .btn:hover { background: rgba(0,0,0,.05); }

  /* Four papers. Yellow is the one people picture; the rest keep a long pad from
     turning into a wall of the same colour. */
  .sticky.p1 { --p1: #fdf0a9; }
  .sticky.p2 { --p1: #e7eef6; }
  .sticky.p3 { --p1: #f6e2c8; }
  .sticky.p4 { --p1: #dff0e2; }
  .sticky.done { filter: saturate(.28); opacity: .62; }
  .sticky.done .stext { text-decoration: line-through;
    text-decoration-color: rgba(51,48,46,.4); }

  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .sticky { color: #2b2825;
      box-shadow: 0 1px 1px rgba(0,0,0,.5), 0 8px 18px -7px rgba(0,0,0,.7); }
    :root:where(:not([data-theme="light"])) .sticky.p1 { --p1: #d8bf62; }
    :root:where(:not([data-theme="light"])) .sticky.p2 { --p1: #b3c3d3; }
    :root:where(:not([data-theme="light"])) .sticky.p3 { --p1: #d3b795; }
    :root:where(:not([data-theme="light"])) .sticky.p4 { --p1: #a9c7b1; }
  }

  /* The blank one at the top of the pad. Same paper, deliberately bigger and
     straight, so it reads as the place you write rather than one of the notes. */
  .newsticky { background: #fdf0a9; border-radius: 2px; padding: 15px;
    box-shadow: 0 1px 1px rgba(0,0,0,.10), 0 8px 18px -7px rgba(0,0,0,.32);
    margin-bottom: 18px; }
  .newsticky textarea { width: 100%; display: block; font: inherit; font-size: 16px;
    line-height: 1.5; border: none; outline: none; resize: none; background: transparent;
    color: #33302e; min-height: 84px; padding: 0; }
  .newsticky textarea::placeholder { color: rgba(51,48,46,.45); }
  .newsticky .crow { display: flex; align-items: center; gap: 9px; margin-top: 6px; }
  .newsticky .chint { flex: 1; font-size: 11px; color: rgba(51,48,46,.55); }
  .newsticky .btn { border-radius: 3px; background: #33302e; border-color: #33302e; color: #fdf0a9; }
  .newsticky .btn:disabled { opacity: .35; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .newsticky { background: #d8bf62; }
    :root:where(:not([data-theme="light"])) .newsticky .btn { color: #d8bf62; }
  }
  .insight { border-left: 3px solid var(--sand, #cfb39c); padding: 2px 0 2px 12px;
    margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--ink-2, #6b6766); }
  .insight b { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-muted, #928d8a); margin-bottom: 4px; font-weight: 700; }

  .fold { font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;

  .empty { font-size: 14px; color: var(--ink-muted, #928d8a); line-height: 1.6;

  .pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .1em;

  .card h3 { font-size: 16px; margin: 0 0 6px; line-height: 1.35; }

  .meta { font-size: 12px; line-height: 1.7; color: var(--ink-2, #6b6766); margin: 8px 0 0; }

  /* ---------- marketing ---------- */
  /* Added 3 September 2026. Ben asked for one central place, so the cost per
     won job lives here rather than on a separate page he has to remember. The
     figures move monthly, not daily, so this panel is written by hand and the
     date it was cut is stated on it. Never let it grow past one screen before
     the fold: the whole point is that he can read it standing on a site. */
  .mkhero { background: #143f5c; border-radius: 12px; padding: 16px 16px 14px;
    color: #fff; margin-bottom: 12px; }
  .mkhero .mkk { font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold, #d4a24e); font-weight: 700; }
  .mkhero .mkn { font-size: 38px; line-height: 1; font-weight: 700; margin: 9px 0 6px;
    font-variant-numeric: tabular-nums; }
  .mkhero .mks { font-size: 13.5px; line-height: 1.5; color: #d3dee7; margin: 0; }
  .mkrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .mktile { flex: 1; background: var(--surface-1, #fff); border-radius: 10px; padding: 11px 12px;
    border: 1px solid var(--border, rgba(20,63,92,.12)); }
  .mktile .v { font-size: 19px; font-weight: 700; color: var(--navy, #143f5c);
    font-variant-numeric: tabular-nums; }
  .mktile .l { font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-muted, #928d8a); margin-top: 3px; line-height: 1.35; }
  .mktbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mktbl th { background: #143f5c; color: #fff; font-size: 10px;
    letter-spacing: .07em; text-transform: uppercase; text-align: right;
    padding: 8px 10px; font-weight: 700; }
  .mktbl th:first-child { text-align: left; }
  .mktbl td { padding: 8px 10px; text-align: right; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--border, rgba(20,63,92,.12)); }
  .mktbl td:first-child { text-align: left; }
  .mktbl tr:last-child td { border-bottom: none; }
  .mktbl .win { color: #0a8a0a; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .mktbl .win { color: #4fbf7a; }
  }
  :root[data-theme="dark"] .mktbl .win { color: #4fbf7a; }
  .mkact { background: var(--surface-1, #fff); border: 1px solid var(--border, rgba(20,63,92,.12));
    border-left: 4px solid #d03b3b; border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; }
  .mkact.two { border-left-color: var(--gold, #d4a24e); }
  .mkact .t { font-weight: 700; font-size: 14.5px; margin-bottom: 5px; line-height: 1.35; }
  .mkact .m { font-size: 13px; line-height: 1.55; color: var(--ink-2, #6b6766); }
  .mkwhen { font-size: 11px; color: var(--ink-muted, #928d8a); letter-spacing: .04em;
    margin: 2px 0 14px; }
  .mkdet { background: var(--surface-1, #fff); border: 1px solid var(--border, rgba(20,63,92,.12));
    border-radius: 10px; margin-bottom: 10px; }
  .mkdet summary { list-style: none; cursor: pointer; padding: 12px 14px;
    font-size: 13.5px; font-weight: 700; color: var(--navy, #143f5c); }
  .mkdet summary::-webkit-details-marker { display: none; }
  .mkdet summary::after { content: "+"; float: right; color: var(--ink-muted, #928d8a); font-weight: 400; }
  .mkdet[open] summary::after { content: "\2212"; }
  .mkdet .in { padding: 0 14px 13px; font-size: 13px; line-height: 1.6;
    color: var(--ink-2, #6b6766); }

</style>
<script>
(function () {
  /* ---------- where things go ---------- */

  var brand = document.querySelector('.brandbar');

  /* The content wrap, which is the Today tab. Not the brand bar's own .wrap,
     which comes first in the document and is a different thing entirely. */
  var today = null;
  var wraps = document.querySelectorAll('.wrap');
  for (var wi = 0; wi < wraps.length; wi++) {
    if (wraps[wi].closest('.brandbar')) continue;
    if (!today || wraps[wi].textContent.length > today.textContent.length) today = wraps[wi];
  }
  if (!today) return; /* fallback page, nothing to tab between */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var day = d.toLocaleDateString('en-CA', { day: 'numeric', month: 'short' });
    var t = d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });
    var days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days === 0) return t;
    if (days === 1) return 'Yesterday, ' + t;
    if (days < 7) return days + ' days ago';
    return day;
  }

  function api(path, opts) {
    return fetch(path, opts || {}).then(function (r) {
      if (r.status === 401) { location.href = '/'; return null; }
      return r.json().then(function (d) {
        // message first: the endpoints put the sentence a person should read
        // there and the machine-readable code in error. Showing the code is how
        // Ben ends up staring at "not-configured".
        if (!r.ok && !d.needsDrop) throw new Error(d.message || d.error || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  var ICON = {
    today: '<path d="M3 5h18v16H3z"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    notes: '<path d="M15 3H5v18h14V7z"/><path d="M14 3v5h5"/><path d="M8 12h7M8 16h5"/>',
    blog:  '<path d="M4 4h11l5 5v11H4z"/><path d="M8 12h8M8 16h5M8 8h4"/>',
    reports: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
    marketing: '<path d="M3 11v3a1 1 0 0 0 1 1h3l4 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a3.5 3.5 0 0 1 0 6"/><path d="M19 6.5a7 7 0 0 1 0 11"/>',
    away: '<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 11h18M8 3v4M16 3v4"/><path d="M9 16h6"/>'
  };

  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }

  /* ---------- the bar ---------- */

  var TABS = [
    { key: 'today',   label: 'Today' },
    { key: 'notes',   label: 'Notes' },
    { key: 'blog',    label: 'Blog' },
    { key: 'reports', label: 'Reports' },
    { key: 'marketing', label: 'Marketing' },
    { key: 'away',    label: 'Away' }
  ];

  var bar = el('div', 'tabbar');
  bar.setAttribute('role', 'tablist');
  var holder = el('div', 'tabbar-wrap');
  holder.appendChild(bar);
  var panels = {};
  var buttons = {};

  TABS.forEach(function (t) {
    var b = el('button', 'tabbtn');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.innerHTML = icon(t.key) + '<span>' + t.label + '</span>';
    b.addEventListener('click', function () { show(t.key, true); });
    bar.appendChild(b);
    buttons[t.key] = b;
    if (t.key === 'today') { panels.today = today; return; }
    var p = el('div', 'panel');
    p.hidden = true;
    panels[t.key] = p;
  });

  if (brand && brand.parentNode) brand.parentNode.insertBefore(holder, brand.nextSibling);
  else document.body.insertBefore(holder, document.body.firstChild);

  /* The panels go after Today, so the reading order matches the tab order for a
     screen reader and for anyone who lands with JavaScript half loaded. */
  var after = today;
  ['notes', 'blog', 'reports', 'marketing', 'away'].forEach(function (k) {
    after.parentNode.insertBefore(panels[k], after.nextSibling);
    after = panels[k];
  });

  var current = 'today';
  var loaded = {};

  function show(key, push) {
    if (!panels[key]) key = 'today';
    current = key;
    TABS.forEach(function (t) {
      panels[t.key].hidden = t.key !== key;
      buttons[t.key].classList.toggle('on', t.key === key);
      buttons[t.key].setAttribute('aria-selected', t.key === key ? 'true' : 'false');
    });
    mailWrap.hidden = key !== 'today';
    if (push) {
      var h = key === 'today' ? ' ' : '#' + key;
      try { history.replaceState(null, '', h); } catch (e) { /* file:// and friends */ }
    }
    window.scrollTo(0, 0);
    if (key !== 'today' && !loaded[key]) { loaded[key] = true; render[key](); }
  }

  function count(key, n) {
    var b = buttons[key];
    var old = b.querySelector('.tcount');
    if (old) old.remove();
    if (n > 0) {
      var c = el('span', 'tcount', String(n));
      b.appendChild(c);
    }
  }

  /* ---------- the mail strip ---------- */
  /* Ben asked for this on 3 September after the chat could not check an email.
     The chat now has the mailbox as a tool, which is the real fix; this is the
     other half of what he asked for, a button that just shows him what has
     landed without him having to phrase a question. Today only: on the other
     tabs it would be noise. */

  var mailWrap = el('div', 'mailbar');
  var mailRow = el('div');
  var mailBtn = el('button', 'mailbtn');
  mailBtn.type = 'button';
  mailBtn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/>' +
    '<path d="M3 7l9 6 9-6"/></svg><span>Check mail</span>';
  var mailWhen = el('span', 'mailwhen', '');
  var mailSpan = el('span', 'mailspan');
  var mailOut = el('div', 'mailout');

  var SPANS = [{ k: 'today', label: 'Today' }, { k: '3d', label: '3 days' }, { k: '7d', label: '7 days' }];
  var spanKey = 'today';

  function hoursFor(k) {
    if (k === '3d') return 72;
    if (k === '7d') return 168;
    /* Today means since local midnight, not the last 24 hours. He asked about
       "an email from today" and those are different questions at 9am. */
    var now = new Date();
    var mid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.max(1, Math.ceil((now - mid) / 3600000));
  }

  SPANS.forEach(function (sp) {
    var b = el('button', null, sp.label);
    b.type = 'button';
    if (sp.k === spanKey) b.className = 'on';
    b.addEventListener('click', function () {
      spanKey = sp.k;
      mailSpan.querySelectorAll('button').forEach(function (x) { x.className = ''; });
      b.className = 'on';
      checkMail();
    });
    mailSpan.appendChild(b);
  });

  mailRow.appendChild(mailBtn);
  mailRow.appendChild(mailSpan);
  mailRow.appendChild(mailWhen);
  mailWrap.appendChild(mailRow);
  mailWrap.appendChild(mailOut);

  function mailCard(m) {
    var c = el('div', 'mailmsg' + (m.unread ? ' unread' : ''));
    c.appendChild(el('div', 'mf', (m.from && (m.from.name || m.from.address)) || 'Unknown sender'));
    c.appendChild(el('div', 'ms', m.subject));
    if (m.preview) c.appendChild(el('div', 'mp', m.preview));
    c.appendChild(el('div', 'mw', when(m.at) + (m.attachments ? ' - has an attachment' : '')));
    var acts = el('div', 'noteact');
    var ask = el('button', 'btn quiet small', 'Ask about this');
    ask.type = 'button';
    ask.addEventListener('click', function () {
      if (window.__NUVO_ASK_ITEM__) {
        window.__NUVO_ASK_ITEM__(
          'An email from ' + ((m.from && (m.from.name || m.from.address)) || 'someone') +
          ': ' + m.subject,
          m.preview || ''
        );
      }
    });
    acts.appendChild(ask);
    if (m.link) {
      var open = el('a', 'btn quiet small', 'Open in Outlook');
      open.href = m.link;
      open.target = '_blank';
      open.rel = 'noopener';
      open.style.textDecoration = 'none';
      acts.appendChild(open);
    }
    c.appendChild(acts);
    return c;
  }

  function checkMail() {
    mailBtn.disabled = true;
    mailWhen.textContent = 'Looking';
    mailOut.textContent = '';
    api('/api/mail?hours=' + hoursFor(spanKey) + '&limit=25').then(function (d) {
      mailBtn.disabled = false;
      if (!d) return;
      mailWhen.textContent = 'Checked ' + when(new Date().toISOString());
      if (!d.messages || !d.messages.length) {
        /* An empty result and a broken pipe must never look the same. Say what
           was searched. */
        mailOut.appendChild(el('div', 'mailnote',
          'Nothing in ' + (spanKey === 'today' ? 'today' : 'the last ' + (spanKey === '3d' ? '3 days' : '7 days')) +
          '. That is a real look at ' + (d.mailbox || 'your mailbox') + ', not a failure.'));
        return;
      }
      d.messages.forEach(function (m) { mailOut.appendChild(mailCard(m)); });
    }).catch(function (e) {
      mailBtn.disabled = false;
      mailWhen.textContent = '';
      var msg = String(e.message || e);
      mailOut.appendChild(el('div', 'mailnote' + (/not connected|not-configured|Live mail is built/.test(msg) ? '' : ' bad'), msg));
    });
  }
  mailBtn.addEventListener('click', function () { checkMail(); });

  /* Above Today, below the ask bar, and outside .wrap on purpose: the chat reads
     .wrap as its page context, and a mailbox preview sitting inside it would be
     fed back into every question he asked. */
  mailWrap.hidden = current !== 'today';
  today.parentNode.insertBefore(mailWrap, today);

  var render = {};

  /* ================= MARKETING ================= */
  /* Added 3 September 2026, the day Ben said he wanted everything in one place
     rather than a page per question. This is the only panel written by hand
     rather than fetched: ad spend and won jobs move monthly, so a live call
     twice a weekday would be noise and one more thing to hang the run.
     Whoever refreshes it: change CUT below, change the numbers, change nothing
     else. If CUT goes more than about six weeks stale the panel says so by
     itself. */

  var MK = {
    cut: '3 September 2026',
    window: '12 months to 31 August 2026',
    channels: [
      { name: 'Referral',      spend: 'nil',     leads: 84,  won: 16, per: 'nil',    pct: 'nil',  best: true },
      { name: 'Facebook',      spend: '$3,254',  leads: 54,  won: 8,  per: '$407',   pct: '0.4%', best: true },
      { name: 'Google search', spend: '$36,093', leads: 180, won: 14, per: '$2,578', pct: '3.4%' }
    ]
  };

  function mkStale() {
    var d = new Date(MK.cut + ' 12:00');
    if (isNaN(d)) return 0;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }

  render.marketing = function () {
    var p = panels.marketing;
    p.innerHTML = '';
    p.appendChild(el('h2', null, 'Marketing'));
    p.appendChild(el('p', 'lead', 'What a won job costs, by channel. Not lead counts. Lead counts do not tell you anything you can act on.'));

    var days = mkStale();
    var stale = days > 45;
    var w = el('p', 'mkwhen', 'Cut ' + MK.cut + ', ' + MK.window +
      (stale ? '. That is ' + days + ' days old and due a refresh.' : '.'));
    p.appendChild(w);

    var hero = el('div', 'mkhero');
    hero.innerHTML =
      '<div class="mkk">The answer</div>' +
      '<div class="mkn">$2,578</div>' +
      '<p class="mks">That is what a won job costs you in Google Ads, 3.4 percent of the contract value. Good for renovation. Keep spending. Facebook wins one for $407.</p>';
    p.appendChild(hero);

    var row = el('div', 'mkrow');
    [['$39,347', 'All ad spend'], ['234', 'Paid leads'], ['22', 'Became jobs']].forEach(function (t) {
      var d = el('div', 'mktile');
      d.innerHTML = '<div class="v">' + t[0] + '</div><div class="l">' + t[1] + '</div>';
      row.appendChild(d);
    });
    p.appendChild(row);

    var a1 = el('div', 'mkact');
    a1.innerHTML =
      '<div class="t">Pause NUVO MOFU Kitchen Search</div>' +
      '<div class="m">Still live. 4,431 clicks since July, zero conversions, clicks at 8 cents. Real Edmonton renovation clicks cost you about $5.70. Nothing buying renovations at 8 cents. Ask whoever runs the ads to pause it, then say where those clicks came from.</div>';
    p.appendChild(a1);

    var a2 = el('div', 'mkact two');
    a2.innerHTML =
      '<div class="t">Ask what the second Google account is for</div>' +
      '<div class="m">Quality Lead Magnet 3000 buys a lead for $628. Your main account buys one for $158. It is 19 percent of the Google budget doing 6 percent of the work.</div>';
    p.appendChild(a2);

    var tbl = el('div', 'card');
    var rows = MK.channels.map(function (c) {
      return '<tr><td>' + c.name + '</td><td>' + c.spend + '</td><td>' + c.won +
        '</td><td' + (c.best ? ' class="win"' : '') + '>' + c.per + '</td></tr>';
    }).join('');
    tbl.innerHTML =
      '<div class="tw"><table class="mktbl"><thead><tr><th>Channel</th><th>Ad spend</th>' +
      '<th>Won</th><th>Per job</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="when">Leads: referral 84, Facebook 54, search 180. Percent of contract value: nil, 0.4, 3.4.</div>';
    p.appendChild(tbl);

    var d1 = el('details', 'mkdet');
    d1.innerHTML =
      '<summary>Facebook wins six times cheaper. Hold it loosely.</summary>' +
      '<div class="in"><p>August called Facebook the weak link on a 12 percent win rate. Win rate was the wrong test. It ignores what the leads cost. Facebook converts worse and costs so little it wins jobs at a sixth of the price, and its won jobs are the biggest on the board at $93,750 average.</p>' +
      '<p>Where it is flattered: Facebook only ran ads four months of twelve, and 17 of its 54 leads landed in months with no spend, so some of that is organic. Strip those out and it is still $594 a job, four times cheaper than Google.</p>' +
      '<p><strong>Eight wins is a small pile.</strong> Not a reason to move the budget. A reason to run a real Facebook spend for one quarter and see if it holds.</p></div>';
    p.appendChild(d1);

    var d2 = el('details', 'mkdet');
    d2.innerHTML =
      '<summary>Where these numbers are soft</summary>' +
      '<div class="in"><ul>' +
      '<li>Job value is a size band, not a contract. Real values would move the percentages.</li>' +
      '<li>Job phase is today\'s state, not history. A job in construction now could still sour.</li>' +
      '<li>83 jobs this year have no source at all. Any could be paid.</li>' +
      '<li>A Google conversion is not a lead. Some are the same person twice.</li>' +
      '<li>Facebook source does not separate paid from organic page traffic.</li>' +
      '</ul></div>';
    p.appendChild(d2);

    var d3 = el('details', 'mkdet');
    d3.innerHTML =
      '<summary>What still cannot be seen</summary>' +
      '<div class="in"><ul>' +
      '<li><strong>Search Console.</strong> No connector exists and Zapier has no app for it. Organic keywords stay dark.</li>' +
      '<li><strong>Google Business Profile.</strong> Authorises, but only a personal unverified account is exposed, so no reviews.</li>' +
      '<li><strong>Semrush.</strong> Subscription active, API units at zero. Billing, not wiring.</li>' +
      '<li><strong>Which campaign won which job.</strong> Nothing carries the campaign into JobTread. Splitting the intake picklist between Google Ads and organic is the cheap fix.</li>' +
      '</ul></div>';
    p.appendChild(d3);

    var ask = el('div', 'noteact');
    [['Draft the note to whoever runs our ads about the MOFU campaign',
      'DRAFT a short note to whoever runs our Google Ads. Ask them to pause the campaign called NUVO MOFU Kitchen Search, which has taken 4,431 clicks since July with zero conversions at 8 cents a click, and to come back with where that traffic came from. My voice, short.'],
     ['What would a real Facebook test look like',
      'ASK me what a proper three month Facebook ads test would look like for Nuvo. Budget, what we would measure, what result would make us move money off Google, and who should own it.']
    ].forEach(function (t) {
      var b = el('button', 'btn quiet small', t[0]);
      b.type = 'button';
      b.setAttribute('data-q', t[1]);
      ask.appendChild(b);
    });
    p.appendChild(ask);
    if (window.__NUVO_BIND__) window.__NUVO_BIND__(p);
  };


  /* ================= NOTES ================= */
  /* A pad. He types, it sticks, it is never deleted. The daily refresh reads
     every open note and puts the ones that have come due onto Today; once a week
     it writes one line here if it finds a real pattern, and nothing if it does
     not. Closing a note takes it off the pad. It does not remove it: the point
     of this pad is the fourth time in six weeks he writes the same note, and a
     pad that forgets cannot show him that. */

  render.notes = function () {
    var p = panels.notes;
    p.innerHTML = '';
    p.appendChild(el('h2', null, 'Notes'));
    var lead = el('p', 'lead', 'Type it and forget it. Tap a note to change it. Nothing here is ever deleted, and anything that comes due turns up on Today by itself.');
    p.appendChild(lead);

    var insightSlot = el('div');
    p.appendChild(insightSlot);

    var comp = el('div', 'newsticky');
    var ta = el('textarea');
    ta.setAttribute('placeholder', 'What is on your mind?');
    ta.setAttribute('rows', '3');
    ta.setAttribute('aria-label', 'New note');
    var row = el('div', 'crow');
    var hint = el('span', 'chint', '');
    var add = el('button', 'btn', 'Stick it');
    add.type = 'button';
    add.disabled = true;
    row.appendChild(hint);
    row.appendChild(add);
    comp.appendChild(ta);
    comp.appendChild(row);
    p.appendChild(comp);

    var list = el('div');
    p.appendChild(list);

    function grow() {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 260) + 'px';
      add.disabled = !ta.value.trim();
    }
    ta.addEventListener('input', grow);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    });

    function save() {
      var text = ta.value.trim();
      if (!text) return;
      add.disabled = true;
      hint.textContent = 'Saving';
      api('/api/notes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: text })
      }).then(function (d) {
        if (!d) return;
        ta.value = '';
        grow();
        hint.textContent = 'Saved';
        setTimeout(function () { hint.textContent = ''; }, 1600);
        load();
      }).catch(function (e) {
        hint.textContent = 'Did not save. ' + e.message;
        add.disabled = false;
      });
    }
    add.addEventListener('click', save);

    /* Paper colour is derived from the note's own id, not its position, so a
       note keeps the same colour for its whole life. Ben will remember "the
       green one" long before he remembers the wording. */
    function paperOf(id) {
      var h = 2166136261;
      for (var i = 0; i < id.length; i++) {
        h ^= id.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      /* Mix the high bits down before taking mod 4. A plain rolling hash leaves
         the bottom two bits barely moving, and four notes in a row came out the
         same colour in testing. */
      h ^= h >>> 15;
      h = Math.imul(h, 2246822507) >>> 0;
      /* XOR in JS yields a SIGNED 32 bit int, and % keeps the sign, so without
         the final >>> 0 this returns p0 and p-1 for half of all ids. */
      h = (h ^ (h >>> 13)) >>> 0;
      return 'p' + ((h % 4) + 1);
    }

    function post(body) {
      return api('/api/notes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function noteCard(n) {
      var c = el('div', 'sticky ' + paperOf(n.id) + (n.status === 'open' ? '' : ' done'));

      var text = el('div', 'stext', n.text);
      var more = null;
      c.appendChild(text);

      /* Clamp only when there is genuinely something to hide. Measured after the
         node is in the document, because scrollHeight is 0 while detached. */
      function maybeClamp() {
        if (text.scrollHeight <= text.clientHeight + 2) return;
        text.classList.add('clamped');
        if (more) return;
        more = el('button', 'smore', 'More');
        more.type = 'button';
        more.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = text.classList.toggle('clamped');
          more.textContent = open ? 'More' : 'Less';
        });
        text.parentNode.insertBefore(more, text.nextSibling);
      }
      c.__measure = maybeClamp;

      var w = el('div', 'swhen');
      w.appendChild(document.createTextNode(when(n.at)));
      if (n.editedAt) w.appendChild(el('span', 'stag', 'edited'));
      if (n.surfacedAt) w.appendChild(el('span', 'stag', 'on today'));
      c.appendChild(w);

      var acts = el('div', 'noteact');

      /* ---- edit in place ---- */
      /* The API has accepted {id, text} since the pad was built. Nothing in the
         page ever offered it, so a note was write-once and Ben had to close one
         and retype it to fix a word. */
      function beginEdit() {
        if (c.classList.contains('editing')) return;
        c.classList.add('editing');

        var ta = el('textarea', 'sedit');
        ta.value = n.text;
        ta.setAttribute('aria-label', 'Edit note');
        var err = el('div', 'serr');
        err.hidden = true;

        var eacts = el('div', 'noteact');
        var save = el('button', 'btn small prim', 'Save');
        var cancel = el('button', 'btn quiet small', 'Cancel');
        save.type = cancel.type = 'button';

        function stop() {
          c.classList.remove('editing');
          load();
        }

        function commit() {
          var v = ta.value.trim();
          if (!v) {
            err.hidden = false;
            err.textContent = 'A note cannot be emptied. Close it instead.';
            return;
          }
          if (v === n.text) { stop(); return; }
          save.disabled = cancel.disabled = true;
          err.hidden = true;
          post({ id: n.id, text: v })
            .then(function (d) { if (d) stop(); })
            .catch(function (e) {
              save.disabled = cancel.disabled = false;
              err.hidden = false;
              err.textContent = e.message;
            });
        }

        save.addEventListener('click', commit);
        cancel.addEventListener('click', stop);
        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { e.preventDefault(); stop(); }
        });
        ta.addEventListener('input', function () {
          ta.style.height = 'auto';
          ta.style.height = Math.max(96, ta.scrollHeight) + 'px';
        });

        eacts.appendChild(save);
        eacts.appendChild(cancel);

        text.hidden = true;
        if (more) more.hidden = true;
        w.hidden = true;
        acts.hidden = true;
        c.appendChild(ta);
        c.appendChild(err);
        c.appendChild(eacts);
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
        ta.style.height = Math.max(96, ta.scrollHeight) + 'px';
      }

      /* Tapping the paper edits it, which is what a sticky note should do.
         Closed notes are read-only until reopened, so a struck-through note is
         not silently editable. */
      if (n.status === 'open') {
        text.addEventListener('click', beginEdit);
        var edit = el('button', 'btn quiet small', 'Edit');
        edit.type = 'button';
        edit.addEventListener('click', beginEdit);
        acts.appendChild(edit);
      }

      var close = el('button', 'btn quiet small', n.status === 'open' ? 'Close' : 'Reopen');
      close.type = 'button';
      close.addEventListener('click', function () {
        close.disabled = true;
        post({ id: n.id, status: n.status === 'open' ? 'closed' : 'open' })
          .then(function (d) { if (d) load(); })
          .catch(function () { close.disabled = false; });
      });

      var ask = el('button', 'btn quiet small', 'Ask');
      ask.type = 'button';
      ask.addEventListener('click', function () {
        if (window.__NUVO_ASK_ITEM__) window.__NUVO_ASK_ITEM__('A note I wrote ' + when(n.at), n.text);
      });

      acts.appendChild(close);
      acts.appendChild(ask);
      c.appendChild(acts);
      return c;
    }

    function load() {
      list.textContent = '';
      list.appendChild(el('div', 'empty', 'Reading the pad'));
      api('/api/notes').then(function (d) {
        if (!d) return;
        insightSlot.innerHTML = '';
        if (d.insight && d.insight.text) {
          var ins = el('p', 'insight');
          ins.appendChild(el('b', null, 'What your notes are saying'));
          ins.appendChild(document.createTextNode(d.insight.text));
          insightSlot.appendChild(ins);
        }
        list.textContent = '';
        var open = d.notes.filter(function (n) { return n.status === 'open'; });
        var closed = d.notes.filter(function (n) { return n.status !== 'open'; });
        if (!open.length) {
          list.appendChild(el('div', 'empty', closed.length
            ? 'Nothing open. ' + closed.length + ' closed ' + (closed.length === 1 ? 'note is' : 'notes are') + ' below.'
            : 'Nothing yet. Write the thing you would otherwise forget by Thursday.'));
        } else {
          var pad = el('div', 'pad');
          var cards = open.map(noteCard);
          cards.forEach(function (card) { pad.appendChild(card); });
          list.appendChild(pad);
          cards.forEach(function (card) { if (card.__measure) card.__measure(); });
        }

        if (closed.length) {
          var openClosed = false;
          var fold = el('button', 'fold', 'Closed notes (' + closed.length + ')');
          fold.type = 'button';
          var box = el('div');
          box.hidden = true;
          fold.addEventListener('click', function () {
            openClosed = !openClosed;
            box.hidden = !openClosed;
            fold.textContent = (openClosed ? 'Hide closed notes' : 'Closed notes (' + closed.length + ')');
            if (openClosed && !box.childNodes.length) {
              var cpad = el('div', 'pad');
              var ccards = closed.map(noteCard);
              ccards.forEach(function (card) { cpad.appendChild(card); });
              box.appendChild(cpad);
              ccards.forEach(function (card) { if (card.__measure) card.__measure(); });
            }
          });
          list.appendChild(fold);
          list.appendChild(box);
        }
      }).catch(function (e) {
        list.textContent = '';
        list.appendChild(el('div', 'say bad', 'Could not read your notes. ' + e.message));
      });
    }

    load();
    grow();
    if (location.hash === '#note') setTimeout(function () { ta.focus(); }, 80);
  };

  /* ================= BLOG ================= */
  /* Every draft the blog task writes lands here first. He reads it where he
     already is, edits it in place, and approves or rejects it.
     Approving does not publish. It marks the draft approved and the next task
     run creates the WordPress draft under Ellie's account, because WordPress is
     reached over Zapier and a Netlify function has no business holding those
     credentials. Nothing goes live without a person.
     Every edit is diffed against what the task originally wrote, and the task
     turns that diff into a line in claude/voice-lessons.md, which it reads
     before it writes the next one. Rejections need a reason for the same
     reason: without one it writes the same post again next month. */

  render.blog = function () {
    var p = panels.blog;
    p.innerHTML = '';
    p.appendChild(el('h2', null, 'Blog'));
    p.appendChild(el('p', 'lead', 'Drafts land here before WordPress. Edit anything you want changed, then approve or reject. What you change teaches it your voice; why you reject teaches it faster.'));
    var list = el('div');
    p.appendChild(list);

    function stateLabel(d) {
      if (d.state === 'published') return 'In WordPress';
      if (d.state === 'approved') return 'Approved, going to WordPress';
      if (d.state === 'rejected') return 'Rejected';
      return 'Waiting on you';
    }

    function draftCard(d) {
      var c = el('div', 'card');
      var pill = el('span', 'pill ' + d.state, stateLabel(d));
      c.appendChild(pill);
      c.appendChild(el('h3', null, d.title));
      c.appendChild(el('div', 'when', when(d.createdAt) + (d.source ? ' · from ' + d.source : '')));

      if (d.reason) {
        var r = el('p', 'meta');
        r.appendChild(el('b', null, 'Why you rejected it '));
        r.appendChild(document.createTextNode(d.reason));
        c.appendChild(r);
      }
      if (d.wpUrl) {
        var a = el('a', null, 'Open the WordPress draft');
        a.href = d.wpUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        var wr = el('p', 'meta');
        wr.appendChild(a);
        c.appendChild(wr);
      }
      if (d.state === 'approved' && !d.wpUrl) {
        c.appendChild(el('p', 'meta', 'Approved. It reaches WordPress on the next task run.'));
      }

      var openBtn = el('button', 'btn quiet small', 'Read and edit');
      openBtn.type = 'button';
      var body = el('div');
      body.hidden = true;
      var opened = false;

      openBtn.addEventListener('click', function () {
        body.hidden = !body.hidden;
        openBtn.textContent = body.hidden ? 'Read and edit' : 'Collapse';
        if (opened) return;
        opened = true;

        var ti = el('input', 'titleedit');
        ti.value = d.title;
        var ta = el('textarea', 'editor');
        ta.value = d.body;
        body.appendChild(ti);
        body.appendChild(ta);

        var say = el('div', 'say');
        var acts = el('div', 'noteact');
        var saveB = el('button', 'btn quiet small', 'Save my edits');
        var okB = el('button', 'btn small', 'Approve');
        var noB = el('button', 'btn small danger', 'Reject');
        saveB.type = okB.type = noB.type = 'button';

        /* reload false when another call follows, or the list rebuilds itself
           out from under the second one and he loses the confirmation. */
        function post(payload, then, reload) {
          say.className = 'say';
          say.textContent = 'Working';
          return api('/api/blog', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(Object.assign({ id: d.id }, payload))
          }).then(function (r) {
            if (!r) return;
            say.className = 'say good';
            say.textContent = then;
            if (reload !== false) setTimeout(load, 700);
          }).catch(function (e) {
            say.className = 'say bad';
            say.textContent = e.message;
            throw e;
          });
        }

        saveB.addEventListener('click', function () {
          post({ action: 'save', title: ti.value, body: ta.value },
            'Saved, and the change is on its way into your voice notes.');
        });
        okB.addEventListener('click', function () {
          /* Save first if he edited, so approving never sends the old words to
             Ellie and never loses the voice lesson in the edit. */
          var edited = ta.value !== d.body || ti.value !== d.title;
          var go = edited
            ? post({ action: 'save', title: ti.value, body: ta.value }, 'Saved', false)
            : Promise.resolve();
          go.then(function () {
            return post({ action: 'approve' }, 'Approved. Ellie gets it as a WordPress draft.');
          }).catch(function () { /* the message is already on screen */ });
        });
        noB.addEventListener('click', function () {
          var rr = el('div', 'reasonrow');
          var inp = el('input');
          inp.setAttribute('placeholder', 'One line: why not?');
          var go = el('button', 'btn small danger', 'Reject');
          go.type = 'button';
          go.addEventListener('click', function () {
            if (!inp.value.trim()) { inp.focus(); return; }
            post({ action: 'reject', reason: inp.value.trim() }, 'Rejected, and it knows why.');
          });
          rr.appendChild(inp);
          rr.appendChild(go);
          if (!body.querySelector('.reasonrow')) body.appendChild(rr);
          inp.focus();
        });

        if (d.state === 'pending') {
          acts.appendChild(saveB);
          acts.appendChild(okB);
          acts.appendChild(noB);
        } else if (d.state === 'rejected') {
          var back = el('button', 'btn quiet small', 'Change my mind');
          back.type = 'button';
          back.addEventListener('click', function () {
            post({ action: 'reopen' }, 'Back on the pile.');
          });
          acts.appendChild(back);
          ta.readOnly = true;
          ti.readOnly = true;
        } else {
          ta.readOnly = true;
          ti.readOnly = true;
        }
        body.appendChild(acts);
        body.appendChild(say);
      });

      var acts0 = el('div', 'noteact');
      acts0.appendChild(openBtn);
      c.appendChild(acts0);
      c.appendChild(body);
      return c;
    }

    function load() {
      list.textContent = '';
      list.appendChild(el('div', 'empty', 'Reading the drafts'));
      api('/api/blog').then(function (d) {
        if (!d) return;
        list.textContent = '';
        count('blog', d.pending);
        if (!d.drafts.length) {
          list.appendChild(el('div', 'empty', 'No drafts yet. The blog task writes from your Plaud job notes; the next one it writes will land here rather than in WordPress.'));
          return;
        }
        var live = d.drafts.filter(function (x) { return x.state === 'pending'; });
        var rest = d.drafts.filter(function (x) { return x.state !== 'pending'; });
        live.forEach(function (x) { list.appendChild(draftCard(x)); });
        if (rest.length) {
          var shown = false;
          var fold = el('button', 'fold', 'Decided (' + rest.length + ')');
          fold.type = 'button';
          var box = el('div');
          box.hidden = true;
          fold.addEventListener('click', function () {
            shown = !shown;
            box.hidden = !shown;
            fold.textContent = shown ? 'Hide decided' : 'Decided (' + rest.length + ')';
            if (shown && !box.childNodes.length) rest.forEach(function (x) { box.appendChild(draftCard(x)); });
          });
          list.appendChild(fold);
          list.appendChild(box);
        }
      }).catch(function (e) {
        list.textContent = '';
        list.appendChild(el('div', 'say bad', 'Could not read the drafts. ' + e.message));
      });
    }
    load();
  };

  /* ================= REPORTS ================= */
  /* Least valuable of the three, built last, and deliberately the most
     restrictive. Five active, no more. Thirty days unopened and it pauses
     itself and says so once. Every one carries an owner, a purpose and the
     decision it informs, because a report that informs no decision is a habit. */

  render.reports = function () {
    var p = panels.reports;
    p.innerHTML = '';
    p.appendChild(el('h2', null, 'Reports'));
    p.appendChild(el('p', 'lead', 'Five at a time, no more. Each one names who owns it and which decision it is for. Anything you have not opened in 30 days pauses itself.'));

    var comp = el('div', 'composer');
    var ta = el('textarea');
    ta.setAttribute('rows', '2');
    ta.setAttribute('placeholder', 'Ask for a report in plain English');
    ta.setAttribute('aria-label', 'Ask for a new report');
    var row = el('div', 'crow');
    var hint = el('span', 'chint', '');
    var ask = el('button', 'btn', 'Ask for it');
    ask.type = 'button';
    ask.disabled = true;
    row.appendChild(hint);
    row.appendChild(ask);
    comp.appendChild(ta);
    comp.appendChild(row);
    var dropSlot = el('div', 'droplist');
    comp.appendChild(dropSlot);
    p.appendChild(comp);

    var list = el('div');
    p.appendChild(list);

    ta.addEventListener('input', function () {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
      ask.disabled = !ta.value.trim();
    });

    function request(dropId) {
      var text = ta.value.trim();
      if (!text) return;
      ask.disabled = true;
      hint.textContent = 'Asking';
      api('/api/reports', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'request', request: text, drop: dropId || undefined })
      }).then(function (d) {
        if (!d) return;
        if (d.needsDrop) {
          /* Five already. Not refused, not queued: he picks what stops. */
          hint.textContent = '';
          dropSlot.innerHTML = '';
          dropSlot.appendChild(el('div', 'say', 'Five is the limit. Which one stops?'));
          d.active.forEach(function (r) {
            var b = el('button', 'btn quiet small');
            b.type = 'button';
            b.textContent = (r.name || r.decision || 'Untitled');
            b.addEventListener('click', function () { dropSlot.innerHTML = ''; request(r.id); });
            dropSlot.appendChild(b);
          });
          var cancel = el('button', 'btn quiet small', 'Never mind');
          cancel.type = 'button';
          cancel.addEventListener('click', function () { dropSlot.innerHTML = ''; ask.disabled = false; });
          dropSlot.appendChild(cancel);
          return;
        }
        ta.value = '';
        ask.disabled = true;
        hint.textContent = 'Asked. The task builds it on the next run.';
        setTimeout(function () { hint.textContent = ''; }, 3000);
        load();
      }).catch(function (e) {
        hint.textContent = e.message;
        ask.disabled = false;
      });
    }
    ask.addEventListener('click', function () { request(null); });

    function reportCard(r) {
      var c = el('div', 'card');
      c.appendChild(el('span', 'pill ' + r.state,
        r.state === 'requested' ? 'Being built' :
        r.state === 'paused' ? 'Paused' :
        r.state === 'dropped' ? 'Dropped' : 'Running'));
      c.appendChild(el('h3', null, r.name || r.requestText));

      if (r.owner || r.purpose || r.decision) {
        var m = el('p', 'meta');
        if (r.owner) { m.appendChild(el('b', null, 'Owner ')); m.appendChild(document.createTextNode(r.owner)); m.appendChild(el('br')); }
        if (r.purpose) { m.appendChild(el('b', null, 'Purpose ')); m.appendChild(document.createTextNode(r.purpose)); m.appendChild(el('br')); }
        if (r.decision) { m.appendChild(el('b', null, 'Decides ')); m.appendChild(document.createTextNode(r.decision)); }
        c.appendChild(m);
      } else if (r.state === 'requested') {
        c.appendChild(el('p', 'meta', 'Waiting on the next task run to give it an owner, a purpose and a decision.'));
      }

      c.appendChild(el('div', 'when',
        (r.lastRun ? 'Last ran ' + when(r.lastRun) : 'Never run') +
        (r.schedule ? ' · ' + r.schedule : '') +
        (r.lastOpened ? ' · you last opened it ' + when(r.lastOpened) : '')));

      if (r.pausedReason) c.appendChild(el('p', 'meta', r.pausedReason + '.'));
      if (r.lastSummary) c.appendChild(el('p', 'meta', r.lastSummary));

      var acts = el('div', 'noteact');
      if (r.lastOutput) {
        var open = el('button', 'btn quiet small', 'Open it');
        open.type = 'button';
        var out = el('div', 'out');
        out.hidden = true;
        out.textContent = r.lastOutput;
        open.addEventListener('click', function () {
          out.hidden = !out.hidden;
          open.textContent = out.hidden ? 'Open it' : 'Close';
          if (!out.hidden) {
            /* Opening the report is what resets the 30 day clock. Opening the
               tab is not, or the rule would never fire. */
            api('/api/reports', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ id: r.id, action: 'open' })
            }).catch(function () {});
          }
        });
        acts.appendChild(open);
        c.appendChild(out);
      }
      if (r.state === 'paused') {
        var res = el('button', 'btn quiet small', 'Start it again');
        res.type = 'button';
        res.addEventListener('click', function () {
          res.disabled = true;
          api('/api/reports', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: r.id, action: 'resume' })
          }).then(function (d) { if (d) load(); })
            .catch(function (e) {
              res.disabled = false;
              c.appendChild(el('div', 'say bad', e.message));
            });
        });
        acts.appendChild(res);
      }
      if (r.state === 'active' || r.state === 'requested') {
        var drop = el('button', 'btn quiet small', 'Stop it');
        drop.type = 'button';
        drop.addEventListener('click', function () {
          drop.disabled = true;
          api('/api/reports', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: r.id, action: 'drop' })
          }).then(function (d) { if (d) load(); })
            .catch(function () { drop.disabled = false; });
        });
        acts.appendChild(drop);
      }
      c.appendChild(acts);
      return c;
    }

    function load() {
      list.textContent = '';
      list.appendChild(el('div', 'empty', 'Reading the list'));
      api('/api/reports').then(function (d) {
        if (!d) return;
        list.textContent = '';
        var live = d.reports.filter(function (r) { return r.state === 'active' || r.state === 'requested'; });
        var rest = d.reports.filter(function (r) { return r.state === 'paused' || r.state === 'dropped'; });
        if (!live.length) {
          list.appendChild(el('div', 'empty', 'Nothing running. Ask for one above, in the words you would use out loud.'));
        }
        live.forEach(function (r) { list.appendChild(reportCard(r)); });
        list.appendChild(el('div', 'when', live.length + ' of ' + d.max + ' running'));
        if (rest.length) {
          var shown = false;
          var fold = el('button', 'fold', 'Paused and stopped (' + rest.length + ')');
          fold.type = 'button';
          var box = el('div');
          box.hidden = true;
          fold.addEventListener('click', function () {
            shown = !shown;
            box.hidden = !shown;
            fold.textContent = shown ? 'Hide those' : 'Paused and stopped (' + rest.length + ')';
            if (shown && !box.childNodes.length) rest.forEach(function (r) { box.appendChild(reportCard(r)); });
          });
          list.appendChild(fold);
          list.appendChild(box);
        }
      }).catch(function (e) {
        list.textContent = '';
        list.appendChild(el('div', 'say bad', 'Could not read the reports. ' + e.message));
      });
    }
    load();
  };

  /* ================= AWAY ================= */
  /* Who is off, 45 days out, one row per person.
     The window is computed from TODAY IN THE BROWSER, not from whatever date
     the roster was pulled on. So it rolls off by itself as the days pass, and a
     roster that is a few days stale still draws a correct window; it is only
     missing anything booked since. The age of the pull is stated on the page
     rather than left for him to guess, because an empty leave board and a
     broken pipe look identical and this build has been bitten by that before. */

  var AWAY_DAYS = 45;

  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymdLocal(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(d.getDate()).padStart(2, '0');
  }
  /* Parse YYYY-MM-DD as a LOCAL date. new Date('2026-09-25') is parsed as UTC,
     which in Mountain time lands on the 24th and shifts every bar a day left. */
  function parseYmd(s) {
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function dayIndex(from, s) {
    return Math.round((parseYmd(s) - from) / 86400000);
  }
  function niceDate(s) {
    return parseYmd(s).toLocaleDateString('en-CA', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function workingDays(a, b) {
    var n = 0, d = parseYmd(a), end = parseYmd(b);
    while (d <= end) { var w = d.getDay(); if (w !== 0 && w !== 6) n++; d = addDays(d, 1); }
    return n;
  }

  render.away = function () {
    var p = panels.away;
    p.innerHTML = '';
    p.appendChild(el('h2', null, 'Away'));
    p.appendChild(el('p', 'lead', 'Who is booked off over the next 45 days. Straight from NuvoCrew leave management. The window moves with the date, so yesterday drops off by itself.'));

    var meta = el('p', 'awmeta');
    p.appendChild(meta);
    var body = el('div');
    p.appendChild(body);

    api('/api/leave').then(function (d) {
      if (!d) return;
      var from = dayStart(new Date());
      var to = addDays(from, AWAY_DAYS - 1);
      var fromS = ymdLocal(from), toS = ymdLocal(to);

      if (d.empty) {
        meta.className = 'awmeta stale';
        meta.textContent = d.message;
        return;
      }

      var age = d.ageDays;
      meta.className = 'awmeta' + (age !== null && age >= 3 ? ' stale' : '');
      meta.textContent =
        'Window ' + niceDate(fromS) + ' to ' + niceDate(toS) + '. ' +
        (age === null ? 'Pull date unknown.'
          : age <= 0 ? 'Pulled from NuvoCrew today.'
          : age === 1 ? 'Pulled from NuvoCrew yesterday.'
          : 'Pulled from NuvoCrew ' + age + ' days ago.') +
        (age !== null && age >= 3 ? ' Anything booked since will not be here.' : '') +
        (d.account ? ' Read through the ' + d.account + ' account.' : '');

      /* Overlap, not containment: a booking that starts before the window and
         ends inside it still means someone is away. */
      var rows = (d.leave || []).filter(function (r) {
        return r.end >= fromS && r.start <= toS;
      });

      if (!rows.length) {
        body.appendChild(el('div', 'empty',
          'Nobody is booked off in the next 45 days. That is a real look at the roster, not a failure. ' +
          (d.horizonTo ? 'The pull looked ahead to ' + niceDate(d.horizonTo) + '.' : '')));
        return;
      }

      /* One row per person, all their bookings on one track. */
      var byPerson = {};
      var order = [];
      rows.forEach(function (r) {
        if (!byPerson[r.name]) { byPerson[r.name] = []; order.push(r.name); }
        byPerson[r.name].push(r);
      });
      order.sort(function (a, b) {
        return byPerson[a][0].start.localeCompare(byPerson[b][0].start);
      });

      /* A date scale every seven days, so the track means something. */
      var scale = el('div', 'awscale');
      for (var i = 0; i < AWAY_DAYS; i += 7) {
        var lab = el('span', null, parseYmd(ymdLocal(addDays(from, i)))
          .toLocaleDateString('en-CA', { day: 'numeric', month: 'short' }));
        lab.style.gridColumn = (i + 1) + ' / span 7';
        scale.appendChild(lab);
      }
      body.appendChild(scale);

      order.forEach(function (name) {
        var list = byPerson[name];
        var row = el('div', 'awrow');

        var whoLine = el('div', 'awwho');
        whoLine.appendChild(el('b', null, name));
        if (list[0].title) whoLine.appendChild(el('span', null, list[0].title +
          (list[0].dept ? ' · ' + list[0].dept : '')));
        row.appendChild(whoLine);

        var track = el('div', 'awtrack');
        for (var i = 0; i < AWAY_DAYS; i++) {
          var d0 = addDays(from, i);
          var cell = el('i');
          var w = d0.getDay();
          if (w === 0 || w === 6) cell.className = 'we';
          if (i === 0) cell.className = (cell.className ? cell.className + ' ' : '') + 'now';
          track.appendChild(cell);
        }
        list.forEach(function (r) {
          var a = Math.max(0, dayIndex(from, r.start));
          var b = Math.min(AWAY_DAYS - 1, dayIndex(from, r.end));
          if (b < a) return;
          var bar = el('div', 'awbar ' + (r.type === 'vacation' ? 'vacation' : r.type === 'sick' ? 'sick' : 'other'));
          bar.style.gridColumn = (a + 1) + ' / ' + (b + 2);
          var span = b - a + 1;
          if (span >= 4) bar.textContent = span + 'd';
          bar.title = name + ', ' + niceDate(r.start) + ' to ' + niceDate(r.end);
          track.appendChild(bar);
        });
        row.appendChild(track);

        list.forEach(function (r) {
          var line = el('div', 'awdates');
          var same = r.start === r.end;
          line.appendChild(el('b', null, same ? niceDate(r.start) : niceDate(r.start) + ' to ' + niceDate(r.end)));
          var wd = workingDays(r.start, r.end);
          /* The status is shown as a flag OR as text, never both. Printing it
             in each gave "sick pending" followed by a "pending" chip. */
          line.appendChild(document.createTextNode(
            ' · ' + wd + ' working day' + (wd === 1 ? '' : 's') +
            (r.hours ? ', ' + r.hours + 'h' : '') +
            ' · ' + r.type + ' '));
          if (r.status && r.status !== 'approved') line.appendChild(el('span', 'awflag', r.status));
          if (/overdraw|override/i.test(r.note || '')) line.appendChild(el('span', 'awflag', 'admin override'));

          /* The reason stays behind a tap. Leave reasons carry medical and
             family detail and this board gets opened on a phone on a site. */
          if (r.reason || r.note) {
            var why = el('button', 'btn quiet small', 'Why');
            why.type = 'button';
            why.style.marginLeft = '8px';
            var box = el('div', 'awwhy');
            box.hidden = true;
            box.textContent = [r.reason, r.note].filter(Boolean).join(' — ');
            why.addEventListener('click', function () {
              box.hidden = !box.hidden;
              why.textContent = box.hidden ? 'Why' : 'Hide';
            });
            line.appendChild(why);
            row.appendChild(line);
            row.appendChild(box);
            return;
          }
          row.appendChild(line);
        });

        body.appendChild(row);
      });

      var key = el('div', 'awkey');
      [['vacation', 'Vacation'], ['sick', 'Sick'], ['other', 'Other']].forEach(function (k) {
        var sp = el('span');
        var sw = el('i');
        sw.className = '';
        sw.style.background = k[0] === 'vacation' ? 'var(--navy, #143f5c)'
          : k[0] === 'sick' ? 'var(--critical, #d03b3b)' : 'var(--sand, #cfb39c)';
        sp.appendChild(sw);
        sp.appendChild(document.createTextNode(k[1]));
        key.appendChild(sp);
      });
      body.appendChild(key);
    }).catch(function (e) {
      meta.className = 'awmeta stale';
      meta.textContent = 'Could not read the leave roster. ' + e.message;
    });
  };

  /* ---------- routing ---------- */
  /* Hash routing, so The One Thing can link straight to a tab and Ben can
     bookmark one. #chat stays the chat's, and is left alone. */

  function fromHash() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'note') return 'notes';
    return panels[h] ? h : null;
  }

  var start = fromHash();
  show(start || 'today', false);
  window.addEventListener('hashchange', function () {
    var h = fromHash();
    if (h && h !== current) show(h, false);
    if (location.hash === '#note' && current === 'notes') {
      var t = panels.notes.querySelector('textarea');
      if (t) t.focus();
    }
  });

  /* A pending draft is something waiting on him, so it earns a number on the
     tab. Notes do not: a pad is not a queue and a count would turn it into one. */
  api('/api/blog').then(function (d) { if (d) count('blog', d.pending); }).catch(function () {});

  /* A number on the Away tab only when someone is off inside the next seven
     days. Further out is planning, not something he needs nudging about. */
  api('/api/leave').then(function (d) {
    if (!d || !d.leave) return;
    var from = dayStart(new Date());
    var a = ymdLocal(from), b = ymdLocal(addDays(from, 6));
    count('away', d.leave.filter(function (r) { return r.end >= a && r.start <= b; }).length);
  }).catch(function () {});
})();
</script>
